// Template only. Render with a scoped InfluxDB write token into
// /etc/icinga2/features-available/influxdb2.conf in the Icinga volume.
object Influxdb2Writer "influxdb2" {
  host = "tsdb_influxdb"
  port = 8086
  organization = "myorg"
  bucket = "icinga_perfdata"
  auth_token = "REPLACE_WITH_SCOPED_WRITE_TOKEN"
  flush_interval = 10s
  host_template = {
    measurement = "icinga_host"
    tags = { hostname = "$host.name$" }
  }
  service_template = {
    measurement = "icinga_service"
    tags = {
      hostname = "$host.name$"
      service = "$service.name$"
    }
  }
}
