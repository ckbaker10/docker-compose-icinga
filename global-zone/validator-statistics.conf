// Installed on the master and synchronized to the ratemymail.eu agent.
// The plugin reads only the validator's loopback HTTP endpoint.
object CheckCommand "iev_statistics" {
    import "plugin-check-command"
    command = [ "/usr/local/libexec/iev-check-statistics" ]
    arguments = {
        "--period" = {
            value = "$iev_period$"
            required = true
        }
    }
    vars.iev_period = "hour"
}
